<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<style>
  :root{
    --bg:#000; --num:#333333; --num-hi:#737373;
    --fn:#A5A5A5; --fn-hi:#D9D9D9;
    --op:#FF9F0A; --op-hi:#FFC76B;
    --gap:12px;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:#fff;display:flex;justify-content:center;align-items:flex-end;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    padding:env(safe-area-inset-top,0) 16px calc(16px + env(safe-area-inset-bottom,0));
    -webkit-user-select:none;user-select:none;
  }
  .calc{width:100%;max-width:390px}
  .display{
    height:150px;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;
    padding:0 10px 8px;overflow:hidden;
  }
  #expr{
    width:100%;text-align:right;font-size:26px;font-weight:300;color:#A5A5A5;
    white-space:nowrap;overflow:hidden;margin-bottom:6px;min-height:32px;
  }
  #out{font-size:80px;font-weight:300;line-height:1;white-space:nowrap}
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
  button{
    appearance:none;border:0;border-radius:50%;aspect-ratio:1;font:inherit;font-size:32px;
    color:#fff;background:var(--num);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .25s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  button:active,button.hit{background:var(--num-hi);transition:none}
  button.fn{background:var(--fn);color:#000}
  button.fn:active,button.fn.hit{background:var(--fn-hi)}
  button.op{background:var(--op);font-size:40px}
  button.op:active,button.op.hit{background:var(--op-hi);transition:none}
  button.op.on{background:#fff;color:var(--op)}
  button:focus-visible{outline:3px solid #fff;outline-offset:2px}
  @media (prefers-reduced-motion:reduce){button{transition:none}}
  @media (max-height:640px){#out{font-size:64px}button{font-size:26px}button.op{font-size:32px}}
</style>
</head>
<body>
<main class="calc" aria-label="Calculator">
  <div class="display" role="status" aria-live="polite"><div id="expr">&nbsp;</div><div id="out">0</div></div>
  <div class="keys" id="keys">
    <button class="fn" id="ac" data-k="AC" aria-label="Clear">AC</button>
    <button class="fn" data-k="NEG" aria-label="Change sign">+/&minus;</button>
    <button class="fn" data-k="%" aria-label="Percent">%</button>
    <button class="op" data-k="/" aria-label="Divide">&divide;</button>

    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="*" aria-label="Multiply">&times;</button>

    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="-" aria-label="Subtract">&minus;</button>

    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+" aria-label="Add">+</button>

    <button class="fn" data-k="BK" aria-label="Delete last digit">&#9003;</button>
    <button data-k=".">.</button>
    <button data-k="0">0</button>
    <button class="op" data-k="=" aria-label="Equals">=</button>
  </div>
</main>

<script>
(function () {
  var cur = "0", acc = null, op = null, fresh = false, err = false;
  var exp = "", eqLine = "";
  var SYM = { "+": "+", "-": "\u2212", "*": "\u00D7", "/": "\u00F7" };
  var expEl = document.getElementById("expr");
  var lastOp = null, lastB = null;
  var out = document.getElementById("out");
  var acBtn = document.getElementById("ac");

  function num(n) { return String(Number(n.toPrecision(9))); }
  function fmt(s) {
    if (err) return "Error";
    var neg = s[0] === "-"; if (neg) s = s.slice(1);
    if (/e/i.test(s)) return (neg ? "-" : "") + s;
    var p = s.split(".");
    var i = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (neg ? "-" : "") + i + (p.length > 1 ? "." + p[1] : "");
  }
  function fit() {
    out.style.fontSize = "";
    var box = out.parentElement, size = parseFloat(getComputedStyle(out).fontSize);
    while (out.scrollWidth > box.clientWidth - 20 && size > 28) {
      size -= 2; out.style.fontSize = size + "px";
    }
  }
  function render() {
    out.textContent = fmt(cur);
    var line = eqLine || (exp + (op && !fresh && !err ? fmt(cur) : ""));
    expEl.textContent = line || "\u00A0";
    expEl.scrollLeft = expEl.scrollWidth;
    fit();
    acBtn.textContent = (cur === "0" && !fresh) || err ? "AC" : "C";
    document.querySelectorAll("button.op").forEach(function (b) {
      b.classList.toggle("on", !!op && fresh && b.dataset.k === op);
    });
  }
  function calc(a, o, b) {
    if (o === "+") return a + b;
    if (o === "-") return a - b;
    if (o === "*") return a * b;
    return b === 0 ? null : a / b;
  }
  function fail() { exp = ""; eqLine = ""; err = true; cur = "0"; acc = null; op = null; lastOp = null; fresh = true; }
  function reset() { exp = ""; eqLine = ""; cur = "0"; acc = null; op = null; fresh = false; err = false; lastOp = null; lastB = null; }

  function digit(d) {
    if (err) reset();
    if (fresh) { if (!op) exp = ""; cur = d; fresh = false; }
    else if (cur.replace(/[-.]/g, "").length < 9) cur = cur === "0" ? d : cur === "-0" ? "-" + d : cur + d;
  }
  function dot() {
    if (err) reset();
    if (fresh) { if (!op) exp = ""; cur = "0."; fresh = false; }
    else if (cur.indexOf(".") < 0) cur += ".";
  }
  function operate(o) {
    if (err) return;
    if (op && fresh) {
      exp = exp.replace(/\S\s$/, SYM[o] + " ");
    } else if (op) {
      var r = calc(acc, op, parseFloat(cur));
      if (r === null) return fail();
      exp += fmt(num(parseFloat(cur))) + " " + SYM[o] + " ";
      acc = Number(r.toPrecision(9)); cur = num(acc);
    } else {
      acc = parseFloat(cur);
      exp = fmt(num(acc)) + " " + SYM[o] + " ";
    }
    op = o; fresh = true;
  }
  function equals() {
    if (err) return;
    var r, line;
    if (op) {
      var b = parseFloat(cur);
      r = calc(acc, op, b);
      if (r === null) return fail();
      line = exp + fmt(num(b)) + " = ";
      lastOp = op; lastB = b; op = null; acc = null;
    } else if (lastOp) {
      var a = parseFloat(cur);
      r = calc(a, lastOp, lastB);
      if (r === null) return fail();
      line = fmt(num(a)) + " " + SYM[lastOp] + " " + fmt(num(lastB)) + " = ";
    } else return;
    cur = num(r); fresh = true; exp = "";
    eqLine = line + fmt(cur);
  }
  function percent() {
    if (err) return;
    var v = parseFloat(cur);
    cur = num(op && (op === "+" || op === "-") && acc !== null ? acc * v / 100 : v / 100);
    fresh = false;
  }
  function press(k) {
    if (k !== "=") eqLine = "";
    if (/^\d$/.test(k)) digit(k);
    else if (k === ".") dot();
    else if (k === "AC") {
      if (acBtn.textContent === "C") { cur = "0"; fresh = false; }
      else reset();
    }
    else if (k === "BK") { if (!fresh && !err) cur = cur.length > 1 && !(cur.length === 2 && cur[0] === "-") ? cur.slice(0, -1) : "0"; }
    else if (k === "NEG") { if (!err && cur !== "0") cur = cur[0] === "-" ? cur.slice(1) : "-" + cur; }
    else if (k === "%") percent();
    else if (k === "=") equals();
    else if (k === "+" || k === "-" || k === "*" || k === "/") operate(k);
    render();
  }

  document.getElementById("keys").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (b) press(b.dataset.k);
  });
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key, id = k;
    if (k === "Enter") { k = id = "="; e.preventDefault(); }
    else if (k === "Backspace") { k = "BK"; id = null; }
    else if (k === "Escape" || k === "Delete" || k === "c" || k === "C") { k = id = "AC"; }
    else if (k === "x" || k === "X") { k = id = "*"; }
    else if (k === ",") { k = id = "."; }
    else if (!(/^\d$/.test(k) || k === "." || k === "=" || k === "%" || "+-*/".indexOf(k) > -1)) return;
    if (k === "/") e.preventDefault();
    press(k);
    var btn = id && document.querySelector('button[data-k="' + id + '"]');
    if (btn) { btn.classList.add("hit"); setTimeout(function () { btn.classList.remove("hit"); }, 120); }
  });
  window.addEventListener("resize", fit);
  render();
})();
</script>
</body>
</html>
