<!DOCTYPE html>
<html lang="en" data-t="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus</title>
<style>
:root{--bg:#0f1126;--p:#171a38;--p2:#212548;--tx:#eceefb;--mu:#8e93b8;--ac:#ff6b9a;--ok:#6ee7d0;--me:#3a3f8f;--them:#212548;--bd:#2c3160}
[data-t=light]{--bg:#f1f0fa;--p:#fff;--p2:#ecebf7;--tx:#1d1f3a;--mu:#6b6f93;--ac:#e0386f;--ok:#0f9d84;--me:#5b5fd6;--them:#fff;--bd:#dcdaee}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#app{display:flex;height:100%;max-width:1440px;margin:auto}
aside{width:340px;background:var(--p);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex:none}
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--p);border-bottom:1px solid var(--bd)}
.hd h1{font-size:19px;letter-spacing:.5px;flex:1}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
button{background:none;border:0;color:var(--tx);cursor:pointer;font-size:18px;padding:6px 8px;border-radius:10px}
button:hover{background:var(--p2)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac)}
input,textarea{background:var(--p2);border:1px solid var(--bd);color:var(--tx);border-radius:14px;padding:10px 14px;font:inherit;width:100%}
.sr{padding:10px 14px}
#list{overflow:auto;flex:1}
.ri{display:flex;gap:12px;align-items:center;padding:11px 14px;cursor:pointer;border-left:3px solid transparent}
.ri:hover{background:var(--p2)}.ri.on{background:var(--p2);border-color:var(--ac)}
.g{flex:1;min-width:0}.g b,.g small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
small,.mu{color:var(--mu)}
.bd{background:var(--ac);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px;font-weight:700}
#msgs{flex:1;overflow:auto;padding:16px 5%;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;background:var(--p);border:1px solid var(--bd);color:var(--mu);font-size:12px;padding:2px 12px;border-radius:99px;margin:8px 0}
.m{display:flex;max-width:min(78%,560px);position:relative}
.m.me{align-self:flex-end}
.b{background:var(--them);border:1px solid var(--bd);padding:7px 11px 5px;border-radius:16px 16px 16px 4px;word-wrap:break-word;overflow-wrap:anywhere;position:relative}
.me .b{background:var(--me);border-color:transparent;color:#fff;border-radius:16px 16px 4px 16px}
.u{font-size:12.5px;font-weight:700;margin-bottom:1px}
.f{font-size:11px;opacity:.7;text-align:right;margin-top:2px}
.sn{color:var(--ok);font-weight:700}
.b img{max-width:100%;border-radius:10px;display:block;margin:2px 0}
.b audio{max-width:100%;height:38px}
.b a{color:inherit;text-decoration:underline}
code{background:#0004;padding:1px 5px;border-radius:5px;font-family:Consolas,monospace;font-size:13px}
.q{border-left:3px solid var(--ac);background:#0003;padding:3px 8px;border-radius:6px;margin-bottom:4px;font-size:13px}
.q b{display:block;color:var(--ac)}
.rx{display:flex;gap:4px;flex-wrap:wrap}
.rc{background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:99px;font-size:12px;padding:0 7px;cursor:pointer;margin-top:3px}
.rc.on{border-color:var(--ac)}
.tb{display:none;position:absolute;top:-18px;right:6px;background:var(--p);border:1px solid var(--bd);border-radius:12px;z-index:3;padding:1px}
.tb button{font-size:15px;padding:3px 6px}
.m:hover .tb,.m.sel .tb{display:flex}
.opt{position:relative;display:flex;justify-content:space-between;gap:12px;background:#0003;border-radius:8px;padding:5px 9px;margin-top:4px;cursor:pointer;overflow:hidden;min-width:200px}
.opt i{position:absolute;inset:0 auto 0 0;background:var(--ac);opacity:.45}
.opt span,.opt em{position:relative;font-style:normal}
.lockd{cursor:pointer}
#pin{display:none;padding:6px 16px;background:var(--p2);border-bottom:1px solid var(--bd);font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{display:none;padding:6px 16px;background:var(--p2);border-top:1px solid var(--bd);font-size:13px;justify-content:space-between;align-items:center}
.cm{display:flex;gap:6px;align-items:flex-end;padding:10px 12px;background:var(--p);border-top:1px solid var(--bd)}
.cm textarea{resize:none;max-height:120px;height:42px;border-radius:20px}
#send{background:var(--ac);color:#fff;border-radius:50%;width:42px;height:42px;flex:none}
#mic.rec{background:#e11d48;color:#fff;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.5}}
#emo{display:none;grid-template-columns:repeat(10,1fr);padding:6px 12px;background:var(--p);border-top:1px solid var(--bd)}
#ty{height:18px;font-size:12px;color:var(--ok);padding:0 5%}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:12px;display:none;z-index:9;max-width:90%}
.bk{display:none}
.empty{margin:auto;text-align:center;color:var(--mu)}
@media(max-width:720px){aside{width:100%}main{display:none}#app.chat aside{display:none}#app.chat main{display:flex}.bk{display:block}.m{max-width:90%}}
</style>
</head>
<body>
<div id="app">
<aside>
 <div class="hd"><div class="av" id="me"></div><h1>Nexus</h1><button id="nr" title="New room">＋</button><button id="th" title="Theme">◐</button></div>
 <div class="sr"><input id="q" placeholder="Search rooms and messages" aria-label="Search"></div>
 <div id="list"></div>
</aside>
<main>
 <div class="hd"><button class="bk" id="bk">←</button><div class="g"><b id="title"></b><small id="sub"></small></div>
  <button id="tt" title="Disappearing messages">⏳</button><button id="lk" title="End-to-end encryption">🔒</button></div>
 <div id="pin"></div>
 <div id="msgs"></div>
 <div id="ty"></div>
 <div id="bar"><span id="bt"></span><button id="bx">✕</button></div>
 <div id="emo"></div>
 <div class="cm">
  <button id="em">😊</button><button id="at">📎</button><input type="file" id="fi" accept="image/*" hidden>
  <textarea id="in" rows="1" placeholder="Message · /poll · /ttl · /lock · /later" aria-label="Message"></textarea>
  <button id="mic" title="Voice note">🎤</button><button id="send" aria-label="Send">➤</button>
 </div>
</main>
</div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL=['#7c5cff','#0ea5b7','#e0488a','#d98a06','#16a37a','#e5484d'];
const col=s=>COL[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
const T=ts=>new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*([^*]+)\*/g,'<b>$1</b>').replace(/(^|\s)_([^_]+)_/g,'$1<i>$2</i>').replace(/~([^~]+)~/g,'<s>$1</s>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>');
let me;try{me=JSON.parse(sessionStorage.nxme)}catch{}
if(!me){let n=''; try{n=(prompt('Choose a display name')||'').trim().slice(0,20)}catch{}; n=n||'Guest'+(100+Math.random()*900|0); me={n,c:col(n)}; try{sessionStorage.nxme=JSON.stringify(me)}catch{}}
const load=()=>{try{return JSON.parse(localStorage.nx)}catch{}return{rooms:[{id:'general',n:'# General',ttl:0},{id:'dev',n:'# Dev Team',ttl:0},{id:'nova',n:'✨ Nova AI',ttl:0,bot:1}],msgs:{}}};
let D=load(),cur='general',reply=null,edit=null,keys={},typing={},lastRoom=null;
const room=()=>D.rooms.find(r=>r.id==cur)||D.rooms[0];
const find=id=>(D.msgs[cur]||[]).find(m=>m.id==id);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.k);e.k=setTimeout(()=>e.style.display='none',3200)}
function mut(f){D=load();f();try{localStorage.nx=JSON.stringify(D)}catch{toast('Storage full. Delete some media messages.')}render()}
/* ---- E2E encryption (AES-GCM, PBKDF2 key from room passphrase) ---- */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),te=new TextEncoder();
async function mk(id,pw){const k=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('nx'+id),iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(id,t){const iv=crypto.getRandomValues(new Uint8Array(12));return b64(iv)+'.'+b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},keys[id],te.encode(t)))}
async function dec(id,s){try{const[i,c]=s.split('.');return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(i)},keys[id],ub(c)))}catch{return null}}
async function plain(r,m){if(!m.enc)return m.t||'';return keys[r.id]?dec(r.id,m.t):null}
async function prev(r,m){return m.del?'Deleted message':m.poll?'📊 '+m.poll.q:m.img?'📷 Photo':m.aud?'🎤 Voice note':(await plain(r,m))??'🔒 Encrypted'}
async function unlock(pw){pw=pw||prompt('Room passphrase');if(!pw)return;keys[cur]=await mk(cur,pw);render()}
async function lock(pw){pw=pw||prompt('Set a passphrase for this room. Share it with members outside Nexus.');if(!pw)return;keys[cur]=await mk(cur,pw);mut(()=>{room().lock=1});toast('New messages are now encrypted')}
/* ---- sending ---- */
async function send(o){const r=room();o=Object.assign({},o);
 if(o.t&&r.lock){if(!keys[r.id])return unlock();o.t=await enc(r.id,o.t);o.enc=1}
 const m={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),u:me.n,c:me.c,ts:Date.now(),seen:[me.n],re:{},...o};
 if(reply)m.r=reply;if(r.ttl)m.x=m.ts+r.ttl*1000;
 const rid=r.id,t=o.t;reply=null;bar();
 mut(()=>{(D.msgs[rid]??=[]).push(m)});
 if(r.bot)nova(rid,m)}
const R=[[/\b(hi|hello|hey)\b/i,'Hey! I am Nova 👋 Try /poll Lunch? | Pizza | Sushi, /ttl 30, /lock secret, or send a voice note.'],[/time/i,()=>'It is '+new Date().toLocaleTimeString()],[/joke/i,'Why do programmers prefer dark mode? Because light attracts bugs 🐛'],[/help|feature/i,'Nexus has encrypted rooms, polls, replies, reactions, voice notes, photos, pins, disappearing messages and scheduled sends.']];
function nova(rid,m){setTimeout(async()=>{const r=D.rooms.find(x=>x.id==rid);let t=await plain(r,m)||'';const h=R.find(x=>x[0].test(t));let a=h?(typeof h[1]=='function'?h[1]():h[1]):(t?'You said: “'+t.slice(0,80)+'”. Say "help" to see what I can do.':'Nice! 👍');
 mut(()=>{(D.msgs[rid]||[]).forEach(x=>x.seen.includes('Nova')||x.seen.push('Nova'));(D.msgs[rid]??=[]).push({id:Date.now().toString(36)+'n',u:'Nova',c:'#0ea5b7',ts:Date.now(),seen:[],re:{},t:a})})},800)}
async function submit(){const i=$('#in'),v=i.value.trim();if(!v)return;i.value='';i.style.height='';
 if(v[0]=='/'){const[c,...a]=v.slice(1).split(' '),s=a.join(' ');
  if(c=='poll'){const p=s.split('|').map(x=>x.trim()).filter(Boolean);if(p.length<3)return toast('Usage: /poll Question | Option 1 | Option 2');return send({poll:{q:p[0],o:p.slice(1,7).map(t=>({t,v:[]}))}})}
  if(c=='ttl'){mut(()=>{room().ttl=Math.max(0,+s||0)});return toast(+s?'Messages vanish after '+(+s)+'s':'Disappearing messages off')}
  if(c=='lock')return lock(s);
  if(c=='later'){const[n,...w]=s.split(' ');if(!+n||!w.length)return toast('Usage: /later 10 message');setTimeout(()=>send({t:w.join(' ')}),n*1000);return toast('Will send in '+n+'s. Keep this tab open.')}
  return toast('Commands: /poll, /ttl 30, /lock passphrase, /later 10 text')}
 if(edit){const id=edit;edit=null;bar();let t=v;if(room().lock){if(!keys[cur])return unlock();t=await enc(cur,v)}return mut(()=>{const m=find(id);if(m){m.t=t;m.ed=1}})}
 send({t:v})}
/* ---- render ---- */
async function renderList(){const q=$('#q').value.toLowerCase();let h='';
 for(const r of D.rooms){const ms=D.msgs[r.id]||[],l=ms[ms.length-1];
  if(q&&!(r.n.toLowerCase().includes(q)||ms.some(m=>!m.enc&&(m.t||'').toLowerCase().includes(q))))continue;
  const un=ms.filter(m=>m.u!=me.n&&!m.seen.includes(me.n)).length,p=l?await prev(r,l):'No messages yet';
  h+=`<div class="ri ${r.id==cur?'on':''}" data-r="${r.id}"><div class="av" style="background:${col(r.n)}">${esc((r.n.replace(/^[#✨ ]+/,'')[0]||'#').toUpperCase())}</div><div class="g"><b>${esc(r.n)}${r.lock?' 🔒':''}${r.ttl?' ⏳':''}</b><small>${esc(String(p).slice(0,44))}</small></div>${un?`<span class="bd">${un}</span>`:''}</div>`}
 $('#list').innerHTML=h||'<p class="empty" style="padding:20px">No matches</p>'}
async function render(){const r=room(),ms=D.msgs[r.id]||[];
 if(document.hasFocus()||lastRoom!==r.id){let ch=0;ms.forEach(m=>{if(!m.seen.includes(me.n)){m.seen.push(me.n);ch=1}});if(ch)try{localStorage.nx=JSON.stringify(D)}catch{}}
 $('#title').textContent=r.n;$('#lk').style.opacity=r.lock?1:.4;$('#tt').textContent=r.ttl?'⏳ '+r.ttl+'s':'⏳';$('#tt').style.opacity=r.ttl?1:.4;
 const us=[...new Set(ms.map(m=>m.u).concat(me.n))];$('#sub').textContent=(r.lock?'End-to-end encrypted · ':'')+us.join(', ');
 let h='',pin=null,day='';
 for(const m of ms){const mine=m.u==me.n,d=new Date(m.ts).toDateString();
  if(d!=day){day=d;h+=`<div class="day">${d==new Date().toDateString()?'Today':d}</div>`}
  let b;
  if(m.del)b='<i class="mu">🚫 This message was deleted</i>';
  else if(m.poll){const tot=m.poll.o.reduce((a,o)=>a+o.v.length,0);b=`<b>📊 ${esc(m.poll.q)}</b>`+m.poll.o.map((o,i)=>`<div class="opt" data-p="${i}"><i style="width:${tot?o.v.length/tot*100:0}%"></i><span>${esc(o.t)}</span><em>${o.v.length}</em></div>`).join('')}
  else if(m.img)b=`<img src="${m.img}" alt="Photo">`;
  else if(m.aud)b=`<audio controls src="${m.aud}"></audio>`;
  else{const t=await plain(r,m);b=t===null?'<a class="lockd" data-a="unlock">🔒 Encrypted. Tap to unlock</a>':fmt(t)}
  const q=m.r&&ms.find(x=>x.id==m.r),qh=q?`<div class="q"><b>${esc(q.u)}</b>${esc((await prev(r,q)).slice(0,80))}</div>`:'';
  if(m.pin&&!m.del)pin=m;
  const rx=Object.entries(m.re).map(([k,v])=>`<span class="rc ${v.includes(me.n)?'on':''}" data-a="${k}">${k} ${v.length}</span>`).join('');
  const tb=m.del?'':`<div class="tb">${['👍','❤️','😂','🔥'].map(x=>`<button data-a="${x}">${x}</button>`).join('')}<button data-a="reply" title="Reply">↩</button>${mine&&!m.poll&&!m.img&&!m.aud?'<button data-a="edit" title="Edit">✎</button>':''}${mine?'<button data-a="del" title="Delete">🗑</button>':''}<button data-a="pin" title="Pin">📌</button></div>`;
  h+=`<div class="m ${mine?'me':''}" data-id="${m.id}"><div class="b">${mine?'':`<div class="u" style="color:${m.c}">${esc(m.u)}</div>`}${qh}${b}<div class="rx">${rx}</div><div class="f">${m.pin?'📌 ':''}${m.ed?'edited · ':''}${m.x?'⏳ ':''}${T(m.ts)}${mine&&!m.del?(m.seen.length>1?' <span class="sn">✓✓</span>':' ✓'):''}</div>${tb}</div></div>`}
 const box=$('#msgs'),bot=box.scrollHeight-box.scrollTop-box.clientHeight<140||lastRoom!==r.id;
 box.innerHTML=h||'<div class="empty"><p style="font-size:40px">💬</p><p>No messages yet.<br>Open this file in a second tab with another name to chat live.</p></div>';
 if(bot)box.scrollTop=box.scrollHeight;lastRoom=r.id;
 const P=$('#pin');if(pin){P.style.display='block';P.dataset.id=pin.id;P.textContent='📌 '+await prev(r,pin)}else P.style.display='none';
 renderList();
 const un=D.rooms.reduce((a,x)=>a+(D.msgs[x.id]||[]).filter(m=>m.u!=me.n&&!m.seen.includes(me.n)).length,0);document.title=(un?`(${un}) `:'')+'Nexus'}
function bar(){const b=$('#bar');const id=edit||reply;b.style.display=id?'flex':'none';if(id){const m=find(id);$('#bt').textContent=(edit?'Editing: ':'Replying to '+(m?m.u:'')+': ')+(m&&m.t&&!m.enc?m.t.slice(0,60):'message')}}
/* ---- events ---- */
$('#msgs').onclick=e=>{const el=e.target.closest('.m');if(!el)return;const t=e.target.closest('[data-a],[data-p]');
 if(!t||e.target.closest('audio'))return el.classList.toggle('sel');
 const id=el.dataset.id,a=t.dataset.a;
 if(a=='unlock')return unlock();
 if(a=='reply'){reply=id;edit=null;bar();return $('#in').focus()}
 if(a=='edit'){const m=find(id);plain(room(),m).then(x=>{edit=id;reply=null;$('#in').value=x||'';bar();$('#in').focus()});return}
 mut(()=>{const m=find(id);if(!m)return;
  if(a=='del'){if(m.u!=me.n)return;m.del=1;m.t='';delete m.img;delete m.aud;delete m.poll;delete m.enc}
  else if(a=='pin')m.pin=!m.pin;
  else if(t.dataset.p!=null){m.poll.o.forEach((o,i)=>{o.v=o.v.filter(u=>u!=me.n);if(i==t.dataset.p)o.v.push(me.n)})}
  else{const l=m.re[a]??=[],i=l.indexOf(me.n);i<0?l.push(me.n):l.splice(i,1);if(!l.length)delete m.re[a]}})};
$('#pin').onclick=e=>{const el=document.querySelector(`[data-id="${e.currentTarget.dataset.id}"]`);el&&el.scrollIntoView({behavior:'smooth',block:'center'})};
$('#list').onclick=e=>{const r=e.target.closest('[data-r]');if(!r)return;cur=r.dataset.r;reply=edit=null;bar();$('#app').classList.add('chat');render()};
$('#bk').onclick=()=>$('#app').classList.remove('chat');
$('#bx').onclick=()=>{reply=edit=null;$('#in').value='';bar()};
$('#q').oninput=renderList;
$('#send').onclick=submit;
$('#in').onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();submit()}};
$('#in').oninput=e=>{e.target.style.height='42px';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px';bc.postMessage({room:cur,u:me.n})};
$('#nr').onclick=()=>{const n=(prompt('Room name')||'').trim();if(n)mut(()=>{D.rooms.push({id:n.toLowerCase().replace(/\W+/g,'')+Date.now().toString(36),n:'# '+n,ttl:0});cur=D.rooms[D.rooms.length-1].id})};
$('#lk').onclick=()=>room().lock?(keys[cur]?toast('Encrypted. Use /lock to rotate the passphrase.'):unlock()):lock();
$('#tt').onclick=()=>{const n={0:30,30:300,300:0}[room().ttl]??0;mut(()=>{room().ttl=n});toast(n?'Messages vanish after '+n+'s':'Disappearing messages off')};
$('#th').onclick=()=>{const t=document.documentElement.dataset.t=='dark'?'light':'dark';document.documentElement.dataset.t=t;try{localStorage.nxt=t}catch{}};
try{document.documentElement.dataset.t=localStorage.nxt||'dark'}catch{}
$('#emo').innerHTML=['😀','😂','😍','🥳','😎','🤔','😭','🙏','👍','👏','🔥','❤️','🎉','💯','👀','🚀','✅','⭐','🤝','💡'].map(e=>`<button>${e}</button>`).join('');
$('#emo').onclick=e=>{if(e.target.tagName=='BUTTON'){$('#in').value+=e.target.textContent;$('#in').focus()}};
$('#em').onclick=()=>{const s=$('#emo').style;s.display=s.display=='grid'?'none':'grid'};
$('#at').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);send({img:c.toDataURL('image/jpeg',.7)})};im.src=URL.createObjectURL(f);e.target.value=''};
let rec,chunks;
$('#mic').onclick=async()=>{if(rec&&rec.state=='recording')return rec.stop();
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(s);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());$('#mic').classList.remove('rec');const fr=new FileReader();fr.onload=()=>send({aud:fr.result});fr.readAsDataURL(new Blob(chunks,{type:rec.mimeType}))};
  rec.start();$('#mic').classList.add('rec');toast('Recording. Tap 🎤 again to send.')}catch{toast('Microphone access is blocked or unavailable')}};
/* ---- live sync between tabs ---- */
const bc=new BroadcastChannel('nx');
bc.onmessage=e=>{const d=e.data;if(d.room==cur&&d.u!=me.n)typing[d.u]=Date.now()};
addEventListener('storage',e=>{if(e.key=='nx'){D=load();render()}});
addEventListener('focus',()=>render());
setInterval(()=>{const n=Object.keys(typing).filter(u=>Date.now()-typing[u]<2500);$('#ty').textContent=n.length?n.join(', ')+' typing…':'';
 D=load();let ch=0;const now=Date.now();for(const k in D.msgs){const l=D.msgs[k].filter(m=>!m.x||m.x>now);if(l.length!=D.msgs[k].length){D.msgs[k]=l;ch=1}}
 if(ch){try{localStorage.nx=JSON.stringify(D)}catch{}render()}},1000);
$('#me').textContent=me.n[0].toUpperCase();$('#me').style.background=me.c;$('#me').title='You are '+me.n;
render();
</script>
</body>
