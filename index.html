<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #2c2c30 0%, #141416 70%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .calculator {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #0b0b0d 0%, #000000 100%);
      width: 340px;
      padding: 24px;
      border-radius: 44px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 28px 60px rgba(0, 0, 0, 0.72),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    /* 5-Second Shimmer Overlay */
    .calculator.shimmering::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      background: linear-gradient(
        115deg,
        transparent 20%,
        rgba(255, 255, 255, 0.06) 38%,
        rgba(255, 255, 255, 0.28) 50%,
        rgba(255, 255, 255, 0.06) 62%,
        transparent 80%
      );
      transform: translateX(-140%);
      animation: shimmerSweep 1.25s ease-in-out 4;
    }

    @keyframes shimmerSweep {
      0% {
        transform: translateX(-140%);
      }
      100% {
        transform: translateX(140%);
      }
    }

    .top-bar {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 4px;
    }

    .history-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .history-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .display {
      height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 0 12px 16px;
      overflow: hidden;
    }

    .expression {
      color: #8e8e93;
      font-size: 20px;
      min-height: 26px;
      margin-bottom: 4px;
      white-space: nowrap;
    }

    .result {
      color: #ffffff;
      font-size: 64px;
      font-weight: 300;
      line-height: 1.1;
      white-space: nowrap;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button.calc-key {
      height: 64px;
      width: 64px;
      border-radius: 50%;
      border: none;
      font-size: 28px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: filter 0.15s ease, background-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
    }

    button.calc-key:active {
      filter: brightness(135%);
      transform: scale(0.96);
    }

    /* Button Colors */
    .btn-func {
      background-color: #a5a5a5;
      color: #000000;
      font-size: 24px;
    }

    .btn-num {
      background-color: #333333;
      color: #ffffff;
    }

    .btn-op {
      background-color: #ff9f0a;
      color: #ffffff;
      font-size: 32px;
    }

    /* Active Operator Highlight */
    .btn-op.active {
      background-color: #ffffff;
      color: #ff9f0a;
    }

    /* Centered Zero Button */
    .btn-zero {
      text-align: center;
    }

    /* History Drawer */
    .history-drawer {
      position: absolute;
      inset: 0;
      background: rgba(14, 14, 16, 0.97);
      backdrop-filter: blur(12px);
      z-index: 15;
      padding: 24px;
      display: none;
      flex-direction: column;
      border-radius: 44px;
    }

    .history-drawer.open {
      display: flex;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .history-header h2 {
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
    }

    .history-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .history-link-btn {
      background: none;
      border: none;
      color: #ff9f0a;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-empty {
      color: #8e8e93;
      font-size: 15px;
      text-align: center;
      margin-top: 60px;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 12px 14px;
      text-align: right;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .history-expr {
      color: #a1a1aa;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .history-val {
      color: #ffffff;
      font-size: 24px;
      font-weight: 400;
    }
  </style>
</head>
<body>

  <div class="calculator shimmering" id="calculator">
    <div class="top-bar">
      <button type="button" class="history-btn" onclick="toggleHistory(true)">History</button>
    </div>

    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="buttons">
      <button type="button" class="calc-key btn-func" id="clear-btn" onclick="handleClear()">AC</button>
      <button type="button" class="calc-key btn-func" onclick="toggleSign()">+/−</button>
      <button type="button" class="calc-key btn-func" onclick="handlePercent()">%</button>
      <button type="button" class="calc-key btn-op" data-op="÷" onclick="chooseOperator('÷', this)">÷</button>

      <button type="button" class="calc-key btn-num" onclick="appendNumber('7')">7</button>
      <button type="button" class="calc-key btn-num" onclick="appendNumber('8')">8</button>
      <button type="button" class="calc-key btn-num" onclick="appendNumber('9')">9</button>
      <button type="button" class="calc-key btn-op" data-op="×" onclick="chooseOperator('×', this)">×</button>

      <button type="button" class="calc-key btn-num" onclick="appendNumber('4')">4</button>
      <button type="button" class="calc-key btn-num" onclick="appendNumber('5')">5</button>
      <button type="button" class="calc-key btn-num" onclick="appendNumber('6')">6</button>
      <button type="button" class="calc-key btn-op" data-op="−" onclick="chooseOperator('−', this)">−</button>

      <button type="button" class="calc-key btn-num" onclick="appendNumber('1')">1</button>
      <button type="button" class="calc-key btn-num" onclick="appendNumber('2')">2</button>
      <button type="button" class="calc-key btn-num" onclick="appendNumber('3')">3</button>
      <button type="button" class="calc-key btn-op" data-op="+" onclick="chooseOperator('+', this)">+</button>

      <button type="button" class="calc-key btn-func" onclick="handleBackspace()">⌫</button>
      <button type="button" class="calc-key btn-num" onclick="appendDecimal()">.</button>
      <button type="button" class="calc-key btn-num btn-zero" onclick="appendNumber('0')">0</button>
      <button type="button" class="calc-key btn-op" onclick="calculate()">=</button>
    </div>

    <div class="history-drawer" id="history-drawer">
      <div class="history-header">
        <h2>History</h2>
        <div class="history-actions">
          <button type="button" class="history-link-btn" onclick="clearHistory()">Clear</button>
          <button type="button" class="history-link-btn" onclick="toggleHistory(false)">Done</button>
        </div>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'ios_calculator_history_v1';

    let currentInput = '0';
    let previousInput = '';
    let operator = null;
    let lastOperand = null;
    let lastOperator = null;
    let shouldResetScreen = false;
    let shimmerTimer = null;
    let memoryHistory = [];

    const calculatorEl = document.getElementById('calculator');
    const resultDisplay = document.getElementById('result');
    const expressionDisplay = document.getElementById('expression');
    const clearBtn = document.getElementById('clear-btn');
    const historyDrawer = document.getElementById('history-drawer');
    const historyListEl = document.getElementById('history-list');

    function loadHistory() {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        return memoryHistory;
      }
    }

    function saveHistory(items) {
      memoryHistory = items.slice(0, 50);
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(memoryHistory));
      } catch (err) {
        // Keep in-memory fallback if storage is restricted
      }
    }

    function addHistoryEntry(exprText, valueText) {
      const items = loadHistory();
      items.unshift({
        id: Date.now(),
        expression: exprText,
        result: valueText
      });
      saveHistory(items);
      renderHistory();
    }

    function clearHistory() {
      memoryHistory = [];
      try {
        window.localStorage.removeItem(STORAGE_KEY);
      } catch (err) {
        // Ignore storage restriction
      }
      renderHistory();
    }

    function renderHistory() {
      const items = loadHistory();
      memoryHistory = items;
      if (!items.length) {
        historyListEl.innerHTML = '<div class="history-empty">No calculations yet.</div>';
        return;
      }

      historyListEl.innerHTML = '';
      items.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <div class="history-expr">${item.expression}</div>
          <div class="history-val">${formatNumber(String(item.result))}</div>
        `;
        div.addEventListener('click', () => {
          currentInput = String(item.result);
          previousInput = '';
          operator = null;
          shouldResetScreen = true;
          expressionDisplay.textContent = item.expression;
          updateDisplay();
          toggleHistory(false);
        });
        historyListEl.appendChild(div);
      });
    }

    function toggleHistory(show) {
      historyDrawer.classList.toggle('open', show);
      if (show) renderHistory();
    }

    function triggerShimmer(durationMs = 5000) {
      clearTimeout(shimmerTimer);
      calculatorEl.classList.remove('shimmering');
      void calculatorEl.offsetWidth;
      calculatorEl.classList.add('shimmering');
      shimmerTimer = setTimeout(() => {
        calculatorEl.classList.remove('shimmering');
      }, durationMs);
    }

    triggerShimmer(5000);
    renderHistory();

    function updateDisplay() {
      const len = currentInput.length;
      if (len > 9) resultDisplay.style.fontSize = '38px';
      else if (len > 6) resultDisplay.style.fontSize = '48px';
      else resultDisplay.style.fontSize = '64px';

      resultDisplay.textContent = formatNumber(currentInput);
      clearBtn.textContent = (currentInput !== '0' || previousInput !== '') ? 'C' : 'AC';
    }

    function formatNumber(numStr) {
      if (numStr === 'Error') return 'Error';
      const parts = numStr.split('.');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return parts.join('.');
    }

    function clearActiveOperator() {
      document.querySelectorAll('.btn-op').forEach(btn => btn.classList.remove('active'));
    }

    function appendNumber(number) {
      clearActiveOperator();
      if (currentInput === '0' || shouldResetScreen) {
        if (shouldResetScreen && operator === null) {
          expressionDisplay.textContent = '';
          previousInput = '';
          lastOperand = null;
          lastOperator = null;
        }
        currentInput = number;
        shouldResetScreen = false;
      } else {
        if (currentInput.replace(/[^0-9]/g, '').length >= 9) return;
        currentInput += number;
      }
      if (operator !== null) {
        expressionDisplay.textContent = `${formatNumber(previousInput)} ${operator} ${formatNumber(currentInput)}`;
      }
      updateDisplay();
    }

    function appendDecimal() {
      clearActiveOperator();
      if (shouldResetScreen) {
        if (operator === null) {
          expressionDisplay.textContent = '';
          previousInput = '';
          lastOperand = null;
          lastOperator = null;
        }
        currentInput = '0.';
        shouldResetScreen = false;
      } else if (!currentInput.includes('.')) {
        currentInput += '.';
      }
      if (operator !== null) {
        expressionDisplay.textContent = `${formatNumber(previousInput)} ${operator} ${formatNumber(currentInput)}`;
      }
      updateDisplay();
    }

    function handleBackspace() {
      if (currentInput === 'Error' || shouldResetScreen) return;
      if (currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);
        if (currentInput === '-') currentInput = '0';
      } else {
        currentInput = '0';
      }
      if (operator !== null) {
        expressionDisplay.textContent = `${formatNumber(previousInput)} ${operator} ${formatNumber(currentInput)}`;
      }
      updateDisplay();
    }

    function handleClear() {
      clearActiveOperator();
      currentInput = '0';
      previousInput = '';
      operator = null;
      lastOperand = null;
      lastOperator = null;
      shouldResetScreen = false;
      expressionDisplay.textContent = '';
      updateDisplay();
    }

    function toggleSign() {
      if (currentInput === '0' || currentInput === 'Error') return;
      currentInput = currentInput.startsWith('-')
        ? currentInput.slice(1)
        : '-' + currentInput;
      if (operator !== null && !shouldResetScreen) {
        expressionDisplay.textContent = `${formatNumber(previousInput)} ${operator} ${formatNumber(currentInput)}`;
      }
      updateDisplay();
    }

    function handlePercent() {
      if (currentInput === 'Error') return;
      currentInput = String(Math.round((parseFloat(currentInput) / 100) * 1e10) / 1e10);
      if (operator !== null && !shouldResetScreen) {
        expressionDisplay.textContent = `${formatNumber(previousInput)} ${operator} ${formatNumber(currentInput)}`;
      }
      updateDisplay();
    }

    function chooseOperator(op, btnElement) {
      if (currentInput === 'Error') return;
      if (operator !== null && !shouldResetScreen) {
        const resultVal = computeValue(parseFloat(previousInput), parseFloat(currentInput), operator);
        if (resultVal === 'Error') {
          showError();
          return;
        }
        previousInput = String(resultVal);
        currentInput = previousInput;
      } else {
        previousInput = currentInput;
      }
      operator = op;
      shouldResetScreen = true;
      expressionDisplay.textContent = `${formatNumber(previousInput)} ${operator}`;

      clearActiveOperator();
      if (btnElement) btnElement.classList.add('active');
      updateDisplay();
    }

    function computeValue(prev, current, op) {
      let computation;
      switch (op) {
        case '+': computation = prev + current; break;
        case '−': computation = prev - current; break;
        case '×': computation = prev * current; break;
        case '÷':
          if (current === 0) return 'Error';
          computation = prev / current;
          break;
        default: return current;
      }
      return Math.round(computation * 1e10) / 1e10;
    }

    function showError() {
      currentInput = 'Error';
      previousInput = '';
      operator = null;
      lastOperand = null;
      lastOperator = null;
      shouldResetScreen = true;
      expressionDisplay.textContent = '';
      clearActiveOperator();
      updateDisplay();
    }

    function calculate() {
      if (currentInput === 'Error') return;

      let prev, current, activeOp;

      if (operator !== null) {
        prev = parseFloat(previousInput);
        current = shouldResetScreen ? prev : parseFloat(currentInput);
        activeOp = operator;
        lastOperator = activeOp;
        lastOperand = current;
      } else if (lastOperator !== null && lastOperand !== null) {
        prev = parseFloat(currentInput);
        current = lastOperand;
        activeOp = lastOperator;
      } else {
        return;
      }

      const resultVal = computeValue(prev, current, activeOp);
      if (resultVal === 'Error') {
        showError();
        return;
      }

      const fullExpr = `${formatNumber(String(prev))} ${activeOp} ${formatNumber(String(current))} =`;
      expressionDisplay.textContent = fullExpr;
      currentInput = String(resultVal);
      addHistoryEntry(fullExpr, currentInput);

      previousInput = '';
      operator = null;
      shouldResetScreen = true;
      clearActiveOperator();
      updateDisplay();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
      if (e.key === '.') appendDecimal();
      if (e.key === 'Backspace') handleBackspace();
      if (e.key === 'Escape') handleClear();
      if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculate(); }
      if (e.key === '+') chooseOperator('+', document.querySelector('[data-op="+"]'));
      if (e.key === '-') chooseOperator('−', document.querySelector('[data-op="−"]'));
      if (e.key === '*') chooseOperator('×', document.querySelector('[data-op="×"]'));
      if (e.key === '/') { e.preventDefault(); chooseOperator('÷', document.querySelector('[data-op="÷"]')); }
    });
  </script>
</body>
</html>
