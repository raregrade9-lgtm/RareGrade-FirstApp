<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #2c2c30 0%, #141416 70%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      gap: 14px;
      padding: 20px;
    }

    .ui-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 340px;
      padding: 0 6px;
    }

    .ui-badge {
      color: #a1a1aa;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .shimmer-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #f4f4f5;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      height: auto;
      width: auto;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .shimmer-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .calculator {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #0b0b0d 0%, #000000 100%);
      width: 340px;
      padding: 24px;
      border-radius: 44px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 28px 60px rgba(0, 0, 0, 0.72),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    /* 5-Second Shimmer Overlay */
    .calculator.shimmering::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      background: linear-gradient(
        115deg,
        transparent 20%,
        rgba(255, 255, 255, 0.06) 38%,
        rgba(255, 255, 255, 0.28) 50%,
        rgba(255, 255, 255, 0.06) 62%,
        transparent 80%
      );
      transform: translateX(-140%);
      animation: shimmerSweep 1.25s ease-in-out 4;
    }

    @keyframes shimmerSweep {
      0% {
        transform: translateX(-140%);
      }
      100% {
        transform: translateX(140%);
      }
    }

    .display {
      height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 0 12px 16px;
      overflow: hidden;
    }

    .expression {
      color: #8e8e93;
      font-size: 20px;
      min-height: 26px;
      margin-bottom: 4px;
      white-space: nowrap;
    }

    .result {
      color: #ffffff;
      font-size: 64px;
      font-weight: 300;
      line-height: 1.1;
      white-space: nowrap;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button.calc-key {
      height: 64px;
      width: 64px;
      border-radius: 50%;
      border: none;
      font-size: 28px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: filter 0.15s ease, background-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
    }

    button.calc-key:active {
      filter: brightness(135%);
      transform: scale(0.96);
    }

    /* Button Colors */
    .btn-func {
      background-color: #a5a5a5;
      color: #000000;
      font-size: 24px;
    }

    .btn-num {
      background-color: #333333;
      color: #ffffff;
    }

    .btn-op {
      background-color: #ff9f0a;
      color: #ffffff;
      font-size: 32px;
    }

    /* Active Operator Highlight */
    .btn-op.active {
      background-color: #ffffff;
      color: #ff9f0a;
    }

    /* Centered Zero Button */
    .btn-zero {
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="ui-toolbar">
    <span class="ui-badge">UI Design</span>
    <button type="button" class="shimmer-btn" onclick="triggerShimmer(5000)">Shimmer 5s</button>
  </div>

  <div class="calculator shimmering" id="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="buttons">
      <button type="button" class="calc-key btn-func" id="clear-btn" onclick="handleClear()">AC</button>
      <button type="button" class="calc-key btn-func" onclick="toggleSign()">+/−</button>
      <button type="button" class="calc-key btn-func" onclick="handlePercent()">%</button>
      <button type="button" class="calc-key btn-op" data-op="÷" onclick="chooseOperator('÷', this)">÷</button>

      <button type="button" class="calc-key btn-num" onclick="appendNumber('7')">7</button>
      <button type="button" class="calc-key btn-num" onclick="appendNumber('8')">8</button>
      <button type="button" class="calc-key btn-num" onclick="appendNumber('9')">9</button>
      <button type="button" class="calc-key btn-op" data-op="×" onclick="chooseOperator('×', this)">×</button>

      <button type="button" class="calc-key btn-num" onclick="appendNumber('4')">4</button>
      <button type="button" class="calc-key btn-num" onclick="appendNumber('5')">5</button>
      <button type="button" class="calc-key btn-num" onclick="appendNumber('6')">6</button>
      <button type="button" class="calc-key btn-op" data-op="−" onclick="chooseOperator('−', this)">−</button>

      <button type="button" class="calc-key btn-num" onclick="appendNumber('1')">1</button>
      <button type="button" class="calc-key btn-num" onclick="appendNumber('2')">2</button>
      <button type="button" class="calc-key btn-num" onclick="appendNumber('3')">3</button>
      <button type="button" class="calc-key btn-op" data-op="+" onclick="chooseOperator('+', this)">+</button>

      <button type="button" class="calc-key btn-func" onclick="handleBackspace()">⌫</button>
      <button type="button" class="calc-key btn-num" onclick="appendDecimal()">.</button>
      <button type="button" class="calc-key btn-num btn-zero" onclick="appendNumber('0')">0</button>
      <button type="button" class="calc-key btn-op" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentInput = '0';
    let previousInput = '';
    let operator = null;
    let lastOperand = null;
    let lastOperator = null;
    let shouldResetScreen = false;
    let shimmerTimer = null;

    const calculatorEl = document.getElementById('calculator');
    const resultDisplay = document.getElementById('result');
    const expressionDisplay = document.getElementById('expression');
    const clearBtn = document.getElementById('clear-btn');

    function triggerShimmer(durationMs = 5000) {
      clearTimeout(shimmerTimer);
      calculatorEl.classList.remove('shimmering');
      // Force reflow so animation restarts cleanly
      void calculatorEl.offsetWidth;
      calculatorEl.classList.add('shimmering');
      shimmerTimer = setTimeout(() => {
        calculatorEl.classList.remove('shimmering');
      }, durationMs);
    }

    // Start 5-second shimmer on initial load
    triggerShimmer(5000);

    function updateDisplay() {
      const len = currentInput.length;
      if (len > 9) resultDisplay.style.fontSize = '38px';
      else if (len > 6) resultDisplay.style.fontSize = '48px';
      else resultDisplay.style.fontSize = '64px';

      resultDisplay.textContent = formatNumber(currentInput);
      clearBtn.textContent = (currentInput !== '0' || previousInput !== '') ? 'C' : 'AC';
    }

    function formatNumber(numStr) {
      if (numStr === 'Error') return 'Error';
      const parts = numStr.split('.');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return parts.join('.');
    }

    function clearActiveOperator() {
      document.querySelectorAll('.btn-op').forEach(btn => btn.classList.remove('active'));
    }

    function appendNumber(number) {
      clearActiveOperator();
      if (currentInput === '0' || shouldResetScreen) {
        if (shouldResetScreen && operator === null) {
          expressionDisplay.textContent = '';
          previousInput = '';
          lastOperand = null;
          lastOperator = null;
        }
        currentInput = number;
        shouldResetScreen = false;
      } else {
        if (currentInput.replace(/[^0-9]/g, '').length >= 9) return;
        currentInput += number;
      }
      if (operator !== null) {
        expressionDisplay.textContent = `${formatNumber(previousInput)} ${operator} ${formatNumber(currentInput)}`;
      }
      updateDisplay();
    }

    function appendDecimal() {
      clearActiveOperator();
      if (shouldResetScreen) {
        if (operator === null) {
          expressionDisplay.textContent = '';
          previousInput = '';
          lastOperand = null;
          lastOperator = null;
        }
        currentInput = '0.';
        shouldResetScreen = false;
      } else if (!currentInput.includes('.')) {
        currentInput += '.';
      }
      if (operator !== null) {
        expressionDisplay.textContent = `${formatNumber(previousInput)} ${operator} ${formatNumber(currentInput)}`;
      }
      updateDisplay();
    }

    function handleBackspace() {
      if (currentInput === 'Error' || shouldResetScreen) return;
      if (currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);
        if (currentInput === '-') currentInput = '0';
      } else {
        currentInput = '0';
      }
      if (operator !== null) {
        expressionDisplay.textContent = `${formatNumber(previousInput)} ${operator} ${formatNumber(currentInput)}`;
      }
      updateDisplay();
    }

    function handleClear() {
      clearActiveOperator();
      currentInput = '0';
      previousInput = '';
      operator = null;
      lastOperand = null;
      lastOperator = null;
      shouldResetScreen = false;
      expressionDisplay.textContent = '';
      updateDisplay();
    }

    function toggleSign() {
      if (currentInput === '0' || currentInput === 'Error') return;
      currentInput = currentInput.startsWith('-')
        ? currentInput.slice(1)
        : '-' + currentInput;
      if (operator !== null && !shouldResetScreen) {
        expressionDisplay.textContent = `${formatNumber(previousInput)} ${operator} ${formatNumber(currentInput)}`;
      }
      updateDisplay();
    }

    function handlePercent() {
      if (currentInput === 'Error') return;
      currentInput = String(Math.round((parseFloat(currentInput) / 100) * 1e10) / 1e10);
      if (operator !== null && !shouldResetScreen) {
        expressionDisplay.textContent = `${formatNumber(previousInput)} ${operator} ${formatNumber(currentInput)}`;
      }
      updateDisplay();
    }

    function chooseOperator(op, btnElement) {
      if (currentInput === 'Error') return;
      if (operator !== null && !shouldResetScreen) {
        const resultVal = computeValue(parseFloat(previousInput), parseFloat(currentInput), operator);
        if (resultVal === 'Error') {
          showError();
          return;
        }
        previousInput = String(resultVal);
        currentInput = previousInput;
      } else {
        previousInput = currentInput;
      }
      operator = op;
      shouldResetScreen = true;
      expressionDisplay.textContent = `${formatNumber(previousInput)} ${operator}`;

      clearActiveOperator();
      if (btnElement) btnElement.classList.add('active');
      updateDisplay();
    }

    function computeValue(prev, current, op) {
      let computation;
      switch (op) {
        case '+': computation = prev + current; break;
        case '−': computation = prev - current; break;
        case '×': computation = prev * current; break;
        case '÷':
          if (current === 0) return 'Error';
          computation = prev / current;
          break;
        default: return current;
      }
      return Math.round(computation * 1e10) / 1e10;
    }

    function showError() {
      currentInput = 'Error';
      previousInput = '';
      operator = null;
      lastOperand = null;
      lastOperator = null;
      shouldResetScreen = true;
      expressionDisplay.textContent = '';
      clearActiveOperator();
      updateDisplay();
    }

    function calculate() {
      if (currentInput === 'Error') return;

      let prev, current, activeOp;

      if (operator !== null) {
        prev = parseFloat(previousInput);
        current = shouldResetScreen ? prev : parseFloat(currentInput);
        activeOp = operator;
        lastOperator = activeOp;
        lastOperand = current;
      } else if (lastOperator !== null && lastOperand !== null) {
        prev = parseFloat(currentInput);
        current = lastOperand;
        activeOp = lastOperator;
      } else {
        return;
      }

      const resultVal = computeValue(prev, current, activeOp);
      if (resultVal === 'Error') {
        showError();
        return;
      }

      expressionDisplay.textContent = `${formatNumber(String(prev))} ${activeOp} ${formatNumber(String(current))} =`;
      currentInput = String(resultVal);
      previousInput = '';
      operator = null;
      shouldResetScreen = true;
      clearActiveOperator();
      updateDisplay();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
      if (e.key === '.') appendDecimal();
      if (e.key === 'Backspace') handleBackspace();
      if (e.key === 'Escape') handleClear();
      if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculate(); }
      if (e.key === '+') chooseOperator('+', document.querySelector('[data-op="+"]'));
      if (e.key === '-') chooseOperator('−', document.querySelector('[data-op="−"]'));
      if (e.key === '*') chooseOperator('×', document.querySelector('[data-op="×"]'));
      if (e.key === '/') { e.preventDefault(); chooseOperator('÷', document.querySelector('[data-op="÷"]')); }
    });
  </script>
</body>
</html>
