<!DOCTYPE html>
<html lang="en" data-t="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus</title>
<style>
:root{--bg:#0f1126;--p:#171a38;--p2:#212548;--tx:#eceefb;--mu:#8e93b8;--ac:#ff6b9a;--ok:#6ee7d0;--me:#3a3f8f;--them:#212548;--bd:#2c3160}
[data-t=light]{--bg:#f1f0fa;--p:#fff;--p2:#ecebf7;--tx:#1d1f3a;--mu:#6b6f93;--ac:#e0386f;--ok:#0f9d84;--me:#5b5fd6;--them:#fff;--bd:#dcdaee}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#app{display:flex;height:100%;max-width:1440px;margin:auto}
aside{width:340px;background:var(--p);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex:none}
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--p);border-bottom:1px solid var(--bd)}
.hd h1{font-size:19px;letter-spacing:.5px;flex:1}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
button{background:none;border:0;color:var(--tx);cursor:pointer;font-size:18px;padding:6px 8px;border-radius:10px}
button:hover{background:var(--p2)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac)}
input,textarea{background:var(--p2);border:1px solid var(--bd);color:var(--tx);border-radius:14px;padding:10px 14px;font:inherit;width:100%}
.sr{padding:10px 14px}
#list{overflow:auto;flex:1}
.ri{display:flex;gap:12px;align-items:center;padding:11px 14px;cursor:pointer;border-left:3px solid transparent}
.ri:hover{background:var(--p2)}.ri.on{background:var(--p2);border-color:var(--ac)}
.g{flex:1;min-width:0}.g b,.g small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
small,.mu{color:var(--mu)}
.bd{background:var(--ac);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px;font-weight:700}
#msgs{flex:1;overflow:auto;padding:16px 5%;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;background:var(--p);border:1px solid var(--bd);color:var(--mu);font-size:12px;padding:2px 12px;border-radius:99px;margin:8px 0}
.m{display:flex;max-width:min(78%,560px);position:relative}
.m.me{align-self:flex-end}
.b{background:var(--them);border:1px solid var(--bd);padding:7px 11px 5px;border-radius:16px 16px 16px 4px;word-wrap:break-word;overflow-wrap:anywhere;position:relative}
.me .b{background:var(--me);border-color:transparent;color:#fff;border-radius:16px 16px 4px 16px}
.u{font-size:12.5px;font-weight:700;margin-bottom:1px}
.f{font-size:11px;opacity:.7;text-align:right;margin-top:2px}
.sn{color:var(--ok);font-weight:700}
.b img{max-width:100%;border-radius:10px;display:block;margin:2px 0}
.b audio{max-width:100%;height:38px}
.b a{color:inherit;text-decoration:underline}
code{background:#0004;padding:1px 5px;border-radius:5px;font-family:Consolas,monospace;font-size:13px}
.q{border-left:3px solid var(--ac);background:#0003;padding:3px 8px;border-radius:6px;margin-bottom:4px;font-size:13px}
.q b{display:block;color:var(--ac)}
.rx{display:flex;gap:4px;flex-wrap:wrap}
.rc{background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:99px;font-size:12px;padding:0 7px;cursor:pointer;margin-top:3px}
.rc.on{border-color:var(--ac)}
.tb{display:none;position:absolute;top:-18px;right:6px;background:var(--p);border:1px solid var(--bd);border-radius:12px;z-index:3;padding:1px}
.tb button{font-size:15px;padding:3px 6px}
.m:hover .tb,.m.sel .tb{display:flex}
.opt{position:relative;display:flex;justify-content:space-between;gap:12px;background:#0003;border-radius:8px;padding:5px 9px;margin-top:4px;cursor:pointer;overflow:hidden;min-width:200px}
.opt i{position:absolute;inset:0 auto 0 0;background:var(--ac);opacity:.45}
.opt span,.opt em{position:relative;font-style:normal}
.lockd{cursor:pointer}
#pin{display:none;padding:6px 16px;background:var(--p2);border-bottom:1px solid var(--bd);font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{display:none;padding:6px 16px;background:var(--p2);border-top:1px solid var(--bd);font-size:13px;justify-content:space-between;align-items:center}
.cm{display:flex;gap:6px;align-items:flex-end;padding:10px 12px;background:var(--p);border-top:1px solid var(--bd)}
.cm textarea{resize:none;max-height:120px;height:42px;border-radius:20px}
#send{background:var(--ac);color:#fff;border-radius:50%;width:42px;height:42px;flex:none}
#mic.rec{background:#e11d48;color:#fff;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.5}}
#emo{display:none;grid-template-columns:repeat(10,1fr);padding:6px 12px;background:var(--p);border-top:1px solid var(--bd)}
#ty{height:18px;font-size:12px;color:var(--ok);padding:0 5%}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:12px;display:none;z-index:9;max-width:90%}
.bk{display:none}
#md,#au{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#au{background:var(--bg);z-index:30}
.mc{background:var(--p);border:1px solid var(--bd);border-radius:18px;padding:18px;width:min(440px,100%);max-height:92vh;overflow:auto;position:relative}
.mc input{margin:6px 0}.mc h3{margin-bottom:8px}.x{position:absolute;top:8px;right:8px}
.pbtn{background:var(--ac);color:#fff;font-size:15px;padding:8px 18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}.chips button{font-size:12px;border:1px solid var(--bd);border-radius:99px;padding:3px 10px}.chips .on{background:var(--ac);color:#fff}
#sb{display:flex;gap:10px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--bd)}
.st{text-align:center;cursor:pointer;width:62px;flex:none}.st small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{padding:2px;border-radius:50%;border:2px solid var(--bd);display:inline-block}.ring.un{border-color:var(--ac)}.ring .av,.st>.av{border-radius:50%;width:46px;height:46px;margin:auto}
.sv{position:relative;height:min(70vh,560px);border-radius:14px;overflow:hidden;color:#fff;margin-top:26px}
.svh{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:10px;background:linear-gradient(#0009,transparent);z-index:2}
.svt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:24px;font-weight:700;padding:30px;pointer-events:none}
.svm{position:absolute;bottom:10px;left:10px;right:10px;color:#fff;background:#0007;padding:6px 10px;border-radius:99px;font-size:13px;z-index:2}
.nv{position:absolute;inset:0;display:flex;z-index:1}.nv i{flex:1}
#lv{width:100%;border-radius:12px;background:#000;max-height:50vh;margin-top:22px}#lc{max-height:130px;overflow:auto}
.tabs{display:flex;gap:6px;padding:8px 14px 0}.tabs button{flex:1;font-size:14px;border-bottom:2px solid transparent;border-radius:8px 8px 0 0}.tabs .on{border-color:var(--ac);color:var(--ac);font-weight:700}
#feed{display:none;flex:1;overflow:auto;padding:0 5% 24px}
#app.fd main>:not(#feed){display:none}#app.fd #feed{display:block}
#feed .hd{margin:0 -5.5% 14px}
.po,.nw{background:var(--p);border:1px solid var(--bd);border-radius:16px;padding:12px;margin:0 auto 16px;max-width:620px}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.po img,#pv img{width:100%;border-radius:12px;display:block;margin-top:6px}
.pa{display:flex;gap:10px;align-items:center;margin:6px 0;border-top:1px solid var(--bd);padding-top:6px}
.pa .on{color:var(--ac)}
.cc{padding:5px 0;font-size:14px}.cc small{margin-left:6px}
.ci{display:flex;gap:6px;margin-top:6px}.ci input{border-radius:99px}
.nw textarea{width:100%;resize:none;height:64px;border-radius:12px}.nw .row{display:flex;justify-content:space-between;margin-top:8px}
#pp{background:var(--ac);color:#fff;font-size:15px;padding:6px 18px}
.empty{margin:auto;text-align:center;color:var(--mu)}
@media(max-width:720px){aside{width:100%}main{display:none}#app.chat aside{display:none}#app.chat main{display:flex}.bk{display:block}.m{max-width:90%}}

:root,[data-t=light]{--bg:#f0f2f5;--p:#fff;--p2:#f0f2f5;--tx:#111b21;--mu:#667781;--ac:#00a884;--ok:#53bdeb;--me:#d9fdd3;--metx:#111b21;--them:#fff;--bd:#e9edef;--wp:#efeae2}
[data-t=dark]{--bg:#0b141a;--p:#111b21;--p2:#202c33;--tx:#e9edef;--mu:#8696a0;--ac:#00a884;--ok:#53bdeb;--me:#005c4b;--metx:#e9edef;--them:#202c33;--bd:#222d34;--wp:#0b141a}
.av{border-radius:50%}#app{max-width:1600px}
#rail{width:76px;background:var(--p2);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;border-right:1px solid var(--bd);flex:none}
#rail button{font-size:22px;width:64px;padding:6px 0;border-radius:12px;line-height:1.2;position:relative}#rail .on{background:var(--bd)}#rail small{display:block;font-size:11px}#rail .on small{color:var(--ac);font-weight:700}
aside .hd,main>.hd{background:var(--p2)}
.ri{padding:10px 14px;border-left:0;border-bottom:1px solid var(--bd)}.ri.on{background:var(--p2)}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;flex:none}.gr{color:var(--ac)}.bd{min-width:20px;text-align:center}
#msgs{background-color:var(--wp);background-image:radial-gradient(#8696a01f 1.2px,transparent 1.3px);background-size:22px 22px;padding:12px 6%}#ty{background:var(--wp)}
.b{border:0;border-radius:0 10px 10px 10px;box-shadow:0 1px 1px #0b141a26;padding:6px 9px 4px}
.me .b{border-radius:10px 0 10px 10px;background:var(--me);color:var(--metx)}.me .f,.me .b a{color:var(--metx)}
.q{background:#00000012}code{background:#0002}.opt{background:#0001}.opt i{background:var(--ac);opacity:.35}
.day{background:var(--p);border:0;box-shadow:0 1px 1px #0b141a22}
.cm{background:var(--p2);border-top:0;align-items:center}.cm textarea{background:var(--p);border:0;border-radius:22px}
#send,#mic{border-radius:50%;width:44px;height:44px;flex:none}#send,#mic:not(.rec){background:var(--ac);color:#fff}
.cm:not(.has) #send,.cm.has #mic{display:none}
#feed{background:var(--bg);padding:0 0 70px}
#feed .hd{margin:0 0 12px;position:sticky;top:0;z-index:4;background:var(--p)}#feed .hd h1{color:var(--ac);font-size:26px;font-weight:800}#bk2{display:none!important}
#fs{display:flex;gap:8px;overflow-x:auto;padding:0 12px 4px;max-width:680px;margin:0 auto 12px}
.stc{position:relative;flex:none;width:104px;height:170px;border-radius:12px;overflow:hidden;background:var(--p);border:1px solid var(--bd);cursor:pointer;color:#fff}
.stc[data-add]{color:var(--tx)}.stc[data-add] .stp{height:118px;display:grid;place-items:center;background:var(--p2)}
.stl{position:absolute;left:8px;bottom:8px;right:8px;font-size:13px;font-weight:700;text-shadow:0 1px 3px #0009}.stc[data-add] .stl{text-shadow:none}
.plus{background:var(--ac);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-grid;place-items:center;font-size:14px;margin-right:4px}
#sb{display:block;padding:0;border:0;overflow:auto;flex:1}
.st.row{display:flex;gap:12px;align-items:center;padding:10px 14px;width:auto;text-align:left}.st.row:hover{background:var(--p2)}
.sh{padding:10px 14px 4px;color:var(--ac);font-size:13px;font-weight:700}
#app.sts #list,#app.sts .sr,#app:not(.sts) #sb{display:none}
#app.fd aside{display:none}#app.fd main{display:flex}
.nw,.po{border:0;box-shadow:0 1px 2px #0b141a2a;border-radius:10px;padding:12px;max-width:680px}
.nw textarea{border-radius:22px;height:56px;padding:12px 16px}
.po img{margin:6px -12px 0;width:calc(100% + 24px);border-radius:0}
.pc{display:flex;justify-content:space-between;font-size:13px;padding:6px 0}
.pa{border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:2px 0;margin:0}.pa button{flex:1;font-size:14px;font-weight:600;color:var(--mu)}.pa .on{color:var(--ac)}
.cc{display:block;width:fit-content;max-width:100%;background:var(--p2);border-radius:16px;padding:6px 12px;margin:4px 0}
@media(max-width:720px){#rail{width:62px}#rail button{width:56px;font-size:20px}#rail small{font-size:10px}#app.chat #rail{display:none}aside{width:auto;flex:1;min-width:0}}
#cl,#sg{display:none;flex:1;overflow:auto}#app.cls #cl,#app.stg #sg{display:block}#app.cls #list,#app.stg #list,#app.cls .sr,#app.stg .sr{display:none}
.nbd{position:absolute;top:0;right:8px;background:var(--ac);color:#fff;border-radius:99px;font-size:11px;font-style:normal;padding:0 6px;min-width:18px}.nbd:empty{display:none}
#gl2{font-size:14px;background:#e5484d;color:#fff;border-radius:99px;padding:6px 14px}
</style>

<body>
<div id="app">
<nav id="rail" aria-label="Main navigation"><button id="t3" title="Calls">📞<small>Calls</small></button><button id="t1" class="on" title="Chats">💬<small>Chats</small><i class="nbd" id="nb"></i></button><button id="t2" title="Updates">🟢<small>Updates</small></button><button id="t4" title="Settings">⚙️<small>Settings</small></button></nav>
<aside>
 <div class="hd"><div class="av" id="me"></div><h1 id="ph">Chats</h1><button id="nr" title="New group">＋</button><button id="th" title="Theme">◐</button><button id="so" title="Sign out">⎋</button></div>

 <div id="sb"></div>
 <div id="list"></div><div id="cl"></div><div id="sg"></div>
</aside>
<main>
 <section id="feed"><div class="hd"><button class="bk" id="bk2">←</button><h1>Nexus</h1><button id="gl2">🔴 Live</button></div><div id="fs"></div>
  <div class="nw"><textarea id="pt" placeholder="Share a photo or an update. Posts stay until you delete them." aria-label="New post"></textarea><div id="pv"></div><div id="ms"></div>

  <div id="fp"></div></section>
 <div class="hd"><button class="bk" id="bk">←</button><div id="ha"></div><div class="g"><b id="title"></b><small id="sub"></small></div>

<script>
(()=>{const q=s=>document.querySelector(s),te=new TextEncoder(),US=()=>{try{return JSON.parse(localStorage.nxu)||{}}catch{return{}}};
window.U=US;
window.shr=(f,mx,cb,sqr)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),x=c.getContext('2d');if(sqr){c.width=c.height=mx;const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,mx,mx)}else{const s=Math.min(1,mx/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;x.drawImage(im,0,0,c.width,c.height)}cb(c.toDataURL('image/jpeg',.75))};im.src=URL.createObjectURL(f)};
const hs=async(p,s)=>{const k=await crypto.subtle.importKey('raw',te.encode(p),'PBKDF2',false,['deriveBits']);return btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:te.encode(s),iterations:100000,hash:'SHA-256'},k,256))))};
const CO=['#7c5cff','#0ea5b7','#e0488a','#d98a06','#16a37a','#e5484d'];let mode='in',pic='';
const go=u=>{sessionStorage.nxme=JSON.stringify({n:u.n,c:u.c,email:u.email});location.reload()};
const draw=()=>{q('#af').innerHTML=mode=='in'?'<input id="f1" placeholder="Email or phone number" autocomplete="username"><input id="f2" type="password" placeholder="Password" autocomplete="current-password">':'<input id="f0" placeholder="Display name"><input id="f1" type="email" placeholder="Email"><input id="f3" type="tel" placeholder="Phone number (contacts)"><input id="f2" type="password" placeholder="Password (6+ characters)"><label class="mu" style="font-size:13px">Profile picture (optional)<input id="f4" type="file" accept="image/*"></label>';
 q('#ai').classList.toggle('on',mode=='in');q('#aq').classList.toggle('on',mode!='in');q('#ae').textContent='';
 if(mode!='in')q('#f4').onchange=e=>e.target.files[0]&&shr(e.target.files[0],160,p=>pic=p,1)};
window.showAuth=()=>{const a=q('#au');a.style.display='flex';
 a.innerHTML='<div class="mc"><h2>Nexus</h2><small>Chat, share photos, post statuses and go live.</small><div class="tabs" style="padding:10px 0 0"><button id="ai" class="on">Sign in</button><button id="aq">Sign up</button></div><div id="af"></div><p id="ae" style="color:var(--ac);min-height:22px"></p><button id="ag" class="pbtn">Continue</button></div>';
 q('#ai').onclick=()=>{mode='in';draw()};q('#aq').onclick=()=>{mode='up';draw()};draw();
 q('#ag').onclick=async()=>{const e=m=>q('#ae').textContent=m,v=s=>(q(s)?.value||'').trim(),us=US(),pw=q('#f2').value,id=v('#f1');
  if(mode=='in'){const dg=id.replace(/\D/g,''),u=Object.values(us).find(x=>x.email==id.toLowerCase()||(dg.length>6&&x.phone==dg));if(!u||await hs(pw,u.salt)!=u.h)return e('Wrong email, phone or password');return go(u)}
  const n=v('#f0'),em=id.toLowerCase(),ph=v('#f3').replace(/\D/g,'');
  if(n.length<2)return e('Enter a display name');if(!/^\S+@\S+\.\S+$/.test(em))return e('Enter a valid email');if(ph.length<7)return e('Enter a valid phone number');if(pw.length<6)return e('Password needs 6 or more characters');
  if(Object.values(us).some(x=>x.email==em||x.phone==ph||x.n.toLowerCase()==n.toLowerCase()))return e('That name, email or phone is already registered');
  const salt=crypto.getRandomValues(new Uint8Array(8)).join(''),u={n,email:em,phone:ph,salt,h:await hs(pw,salt),pic,c:CO[n.length%6]};us[em]=u;localStorage.nxu=JSON.stringify(us);go(u)}};
})();
</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL=['#7c5cff','#0ea5b7','#e0488a','#d98a06','#16a37a','#e5484d'];
const col=s=>COL[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
const T=ts=>new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*([^*]+)\*/g,'<b>$1</b>').replace(/(^|\s)_([^_]+)_/g,'$1<i>$2</i>').replace(/~([^~]+)~/g,'<s>$1</s>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>');
let me;try{me=JSON.parse(sessionStorage.nxme)}catch{}
if(!me){showAuth();throw 'auth'}
const load=()=>{try{return JSON.parse(localStorage.nx)}catch{}return{rooms:[{id:'general',n:'# General',ttl:0},{id:'dev',n:'# Dev Team',ttl:0},{id:'nova',n:'✨ Nova AI',ttl:0,bot:1}],msgs:{}}};
let D=load(),cur='general',reply=null,edit=null,keys={},typing={},lastRoom=null;
const room=()=>D.rooms.find(r=>r.id==cur)||D.rooms[0];
const find=id=>(D.msgs[cur]||[]).find(m=>m.id==id);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.k);e.k=setTimeout(()=>e.style.display='none',3200)}
function mut(f){D=load();f();try{localStorage.nx=JSON.stringify(D)}catch{toast('Storage full. Delete some media messages.')}render()}

function openDm(n){const id='dm_'+[me.n,n].sort().join('_').replace(/\W+/g,'');cur=id;mut(()=>{D.rooms.some(x=>x.id==id)||D.rooms.push({id,n,ttl:0,mem:[me.n,n],dm:1})});closeMd();showTab(1);$('#app').classList.add('chat')}
function newGroup(){const us=Object.values(U()).map(u=>u.n).filter(n=>n!=me.n);
 md(`<h3>New group</h3><input id="gn" placeholder="Group name"><p class="sh">Add members</p>${us.length?us.map(n=>`<label class="ri"><input type="checkbox" value="${esc(n)}" style="width:auto">${AV(n,col(n),36)}<b>${esc(n)}</b></label>`).join(''):'<small>No contacts yet.</small>'}<button class="pbtn" id="gc" style="margin-top:12px">Create group</button>`);
 $('#gc').onclick=()=>{const n=$('#gn').value.trim();if(!n)return toast('Enter a group name');const m=[...$('#mb').querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value),id='g'+Date.now().toString(36);cur=id;mut(()=>{D.rooms.push({id,n:'# '+n,ttl:0,mem:[me.n,...m],adm:me.n})});closeMd();showTab(1);$('#app').classList.add('chat')}}
$('#nr').onclick=()=>{const us=Object.values(U()).filter(u=>u.n!=me.n);
 md(`<h3>New chat</h3><div class="ri" id="ng"><div class="av" style="width:44px;height:44px;background:var(--ac);display:grid;place-items:center">👥</div><b>New group</b></div><p class="sh">Contacts on Nexus</p>${us.length?us.map(u=>`<div class="ri" data-d="${esc(u.n)}">${AV(u.n,u.c,44)}<div class="g"><b>${esc(u.n)}</b><small>${esc(u.phone)}</small></div></div>`).join(''):'<small>No contacts yet. Others sign up on this browser to appear here.</small>'}`);
 $('#ng').onclick=newGroup;$('#mb').querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>openDm(e.dataset.d))};
/* statuses (24h) */
const gst=()=>{try{return JSON.parse(localStorage.nxst).filter(x=>Date.now()-x.ts<864e5)}catch{return[]}};
const BG=['#5b5fd6','#e0386f','#0e8a99','#c27a05','#16845f'];
function rs(){const l=gst(),us=[...new Set(l.map(x=>x.u))],un=u=>l.some(x=>x.u==u&&!x.v.includes(me.n)),lt=u=>T(l.filter(x=>x.u==u).pop().ts);
 $('#sb').innerHTML=`<div class="st row" data-add="1"><div class="ring">${AV(me.n,me.c,46)}</div><div class="g"><b>My status</b><small>Tap to add a status update</small></div><span class="plus">＋</span></div><p class="sh">Recent updates</p>`+(us.length?us.map(u=>`<div class="st row" data-u="${esc(u)}"><div class="ring ${un(u)?'un':''}">${AV(u,col(u),46)}</div><div class="g"><b>${u==me.n?'You':esc(u)}</b><small>${lt(u)}</small></div></div>`).join(''):'<small style="display:block;padding:20px">No updates yet</small>');
 $('#fs').innerHTML=`<div class="stc" data-add="1"><div class="stp">${AV(me.n,me.c,64)}</div><div class="stl"><span class="plus">＋</span>Add story</div></div>`+us.map(u=>{const x=l.find(y=>y.u==u);return `<div class="stc" data-u="${esc(u)}" style="background:${x.img?`#000 url(${x.img}) center/cover`:x.bg}"><div class="ring ${un(u)?'un':''}" style="position:absolute;top:8px;left:8px">${AV(u,col(u),32)}</div><div class="stl">${u==me.n?'You':esc(u)}</div></div>`}).join('')}
const sc=e=>{const t=e.target.closest('.st,.stc');if(!t)return;t.dataset.add?addSt():vw(t.dataset.u,0)};$('#sb').onclick=sc;$('#fs').onclick=sc;
function addSt(){smu=null;sbg=0;sim=null;md('<h3>New status</h3><textarea id="stx" placeholder="What is on your mind?" style="width:100%;height:90px;border-radius:12px;margin:8px 0"></textarea><div id="spv"></div><div id="sms"></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span><button id="sbc" title="Background colour">🎨</button><button id="sbp" title="Photo">📷</button></span><button class="pbtn" id="sbg">Share status</button></div>');
 const t=$('#stx'),up=()=>{t.style.background=sim?'':BG[sbg];t.style.color=sim?'':'#fff'};up();
 t.oninput=()=>sugg($('#sms'),t.value,x=>smu=x,!!sim);
 $('#sbc').onclick=()=>{sbg=(sbg+1)%BG.length;up()};
 $('#sbp').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>shr(i.files[0],720,p=>{sim=p;up();$('#spv').innerHTML=`<img src="${p}" alt="Preview" style="width:100%;border-radius:10px">`;sugg($('#sms'),t.value,x=>smu=x,1)});i.click()};
 $('#sbg').onclick=()=>{const x=t.value.trim();if(!x&&!sim)return toast('Add text or a photo');const a=gst();a.push({id:Date.now().toString(36),u:me.n,c:me.c,ts:Date.now(),t:x,img:sim,bg:BG[sbg],mu:smu,v:[]});try{localStorage.nxst=JSON.stringify(a)}catch{return toast('Storage full')}closeMd();rs()}}
function vw(u,i){const l=gst().filter(x=>x.u==u),x=l[i];if(!x)return closeMd();
 if(!x.v.includes(me.n)){const a=gst();a.find(y=>y.id==x.id).v.push(me.n);x.v.push(me.n);localStorage.nxst=JSON.stringify(a);rs()}
 md(`<div class="sv" style="background:${x.img?`#000 url(${x.img}) center/contain no-repeat`:x.bg}"><div class="svh">${AV(u,x.c,34)}<b>${esc(u)}</b><small style="color:#fff">${T(x.ts)}${u==me.n?' · 👁 '+Math.max(0,x.v.length-1):''}</small></div>${x.t?`<p class="svt">${fmt(x.t)}</p>`:''}${x.mu?`<a class="svm" href="https://www.youtube.com/results?search_query=${encodeURIComponent(x.mu)}" target="_blank" rel="noopener">🎵 ${esc(x.mu)}</a>`:''}<div class="nv"><i data-n="-1"></i><i data-n="1"></i></div></div>`);
 $('#mb .nv').onclick=e=>{const n=e.target.dataset.n;if(n)vw(u,i+ +n)}}
rs();setInterval(rs,60000);
/* live streaming: WebRTC between tabs of this browser, signalled over BroadcastChannel */
let LS,LT,LH=null,vpc,pcs={};const bl=new BroadcastChannel('nxlive');
const lvs=()=>{try{return JSON.parse(localStorage.nxl)||{}}catch{return{}}};
const hb=()=>{const o=lvs();o[me.n]=Date.now();localStorage.nxl=JSON.stringify(o)};
const gd=pc=>new Promise(r=>{if(pc.iceGatheringState=='complete')r();else pc.onicegatheringstatechange=()=>pc.iceGatheringState=='complete'&&r()});
const cnt=()=>{const e=$('#lcnt');if(e&&LS)e.textContent='👁 '+Object.values(pcs).filter(p=>p.connectionState=='connected').length+' watching'};
const addLc=(u,x)=>{const e=$('#lc');if(e){e.insertAdjacentHTML('beforeend',`<div class="cc"><b>${esc(u)}</b> ${esc(x)}</div>`);e.scrollTop=e.scrollHeight}};
function sUI(h,host,cl){md(`<h3>${host?'🔴 You are live':'🔴 '+esc(h)+' is live'}</h3><video id="lv" autoplay playsinline ${host?'muted':''}></video><small id="lcnt"></small><div id="lc"></div><div class="ci"><input id="li" placeholder="Comment" aria-label="Live comment"><button id="ls">➤</button></div>`,cl);
 const f=()=>{const i=$('#li'),x=i.value.trim();if(!x)return;i.value='';addLc(me.n,x);bl.postMessage({t:'lc',host:h,u:me.n,x})};$('#ls').onclick=f;$('#li').onkeydown=e=>e.key=='Enter'&&f()}
function liveUI(){const o=lvs(),h=Object.keys(o).filter(k=>Date.now()-o[k]<9000&&k!=me.n);
 md(`<h3>📡 Live</h3><button class="pbtn" id="gl">🔴 Go live</button><p class="mu" style="margin:12px 0 4px">${h.length?'Live now':'Nobody else is live right now'}</p>${h.map(k=>`<div class="ri" data-w="${esc(k)}">${AV(k,col(k))}<b>${esc(k)}</b></div>`).join('')}`);
 $('#gl').onclick=goLive;$('#mb').querySelectorAll('[data-w]').forEach(e=>e.onclick=()=>watch(e.dataset.w))}
async function goLive(){try{LS=await navigator.mediaDevices.getUserMedia({video:true,audio:true})}catch{return toast('Camera or microphone is blocked or unavailable')}
 hb();LT=setInterval(hb,3000);sUI(me.n,1,()=>{clearInterval(LT);LS.getTracks().forEach(t=>t.stop());LS=null;Object.values(pcs).forEach(p=>p.close());pcs={};const o=lvs();delete o[me.n];localStorage.nxl=JSON.stringify(o);bl.postMessage({t:'end',host:me.n})});$('#lv').srcObject=LS}
function watch(h){LH=h;sUI(h,0,()=>{vpc&&vpc.close();vpc=null;LH=null});bl.postMessage({t:'join',to:h,from:me.n})}
bl.onmessage=async e=>{const d=e.data;
 if(d.t=='lc'){if(d.host==(LS?me.n:LH))addLc(d.u,d.x);return}
 if(d.t=='end'){if(d.host==LH){toast(d.host+' ended the live');closeMd()}return}
 if(d.to!=me.n)return;
 if(d.t=='join'&&LS){const pc=pcs[d.from]=new RTCPeerConnection();LS.getTracks().forEach(t=>pc.addTrack(t,LS));pc.onconnectionstatechange=cnt;await pc.setLocalDescription(await pc.createOffer());await gd(pc);bl.postMessage({t:'offer',to:d.from,from:me.n,s:pc.localDescription.toJSON()})}
 else if(d.t=='offer'&&LH){vpc=new RTCPeerConnection();vpc.ontrack=x=>{$('#lv').srcObject=x.streams[0]};await vpc.setRemoteDescription(d.s);await vpc.setLocalDescription(await vpc.createAnswer());await gd(vpc);bl.postMessage({t:'answer',to:d.from,from:me.n,s:vpc.localDescription.toJSON()})}
 else if(d.t=='answer'&&pcs[d.from])await pcs[d.from].setRemoteDescription(d.s)};
$('#t3').onclick=()=>showTab(3);$('#t4').onclick=()=>showTab(4);$('#gl2').onclick=liveUI;
addEventListener('storage',e=>{if(e.key=='nxu'){ru();myAv();render();renderF()}if(e.key=='nxst')rs()});
function tg(){$('.cm').classList.toggle('has',!!$('#in').value.trim())}
['input','keyup'].forEach(v=>$('#in').addEventListener(v,tg));$('#send').addEventListener('click',()=>setTimeout(tg,50));
$('#pt').placeholder="What's on your mind, "+me.n+"?";
/* ---- Calls (WebRTC voice/video between tabs, signalled over BroadcastChannel) ---- */
const gcl=()=>{try{return JSON.parse(localStorage.nxcl)||[]}catch{return[]}};
const fd=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
function rc(){const L=gcl().filter(c=>c.a==me.n||c.b==me.n).slice(-30).reverse(),us=Object.values(U()).filter(u=>u.n!=me.n);
 $('#cl').innerHTML='<p class="sh">Start a call</p>'+(us.length?us.map(u=>`<div class="ri">${AV(u.n,u.c,44)}<div class="g"><b>${esc(u.n)}</b><small>${esc(u.phone)}</small></div><button data-c="${esc(u.n)}" data-v="0" title="Voice call">📞</button><button data-c="${esc(u.n)}" data-v="1" title="Video call">🎥</button></div>`).join(''):'<small style="display:block;padding:14px">No contacts yet. Others sign up on this browser to appear here.</small>')+'<p class="sh">Recent</p>'+(L.length?L.map(c=>{const o=c.a==me.n?c.b:c.a;return `<div class="ri">${AV(o,col(o),44)}<div class="g"><b style="${c.ok?'':'color:#e5484d'}">${esc(o)}</b><small>${c.a==me.n?'↗':'↙'} ${c.v?'Video':'Voice'} · ${c.ok?fd(c.d):'Missed'} · ${DT(c.ts)}</small></div></div>`}).join(''):'<small style="display:block;padding:14px">No calls yet</small>')}
$('#cl').onclick=e=>{const b=e.target.closest('[data-c]');b&&call(b.dataset.c,+b.dataset.v)};
let CP,CS,CU,CT,CST=0,CTM;const bk=new BroadcastChannel('nxcall');
function logc(o){const l=gcl();l.push(o);localStorage.nxcl=JSON.stringify(l.slice(-100));rc()}
function cm(t,sub,inc){md(`<h3>${t}</h3><p class="mu" id="cs">${sub}</p><video id="rv" autoplay playsinline style="width:100%;border-radius:12px;background:#000;max-height:50vh;${CU.v?'':'display:none'}"></video><video id="lv2" autoplay muted playsinline style="width:90px;position:absolute;right:26px;top:96px;border-radius:8px;${CU.v?'':'display:none'}"></video><div style="display:flex;gap:14px;justify-content:center;align-items:center;margin-top:12px">${inc?'<button class="pbtn" id="ca">Accept</button>':'<button id="cmu" title="Mute">🎙️</button>'}<button class="pbtn" style="background:#e5484d" id="ce">${inc?'Decline':'End'}</button></div>`,()=>endCall(1));
 $('#ce').onclick=closeMd;if(inc)$('#ca').onclick=accept;else $('#cmu').onclick=()=>{const t=CS.getAudioTracks()[0];t.enabled=!t.enabled;$('#cmu').textContent=t.enabled?'🎙️':'🔇'}}
function pcn(){CP=new RTCPeerConnection();CP.ontrack=x=>{const v=$('#rv');if(v)v.srcObject=x.streams[0]}}
function connected(){CST=Date.now();clearTimeout(CT);clearInterval(CTM);CTM=setInterval(()=>{const e=$('#cs');e&&(e.textContent=fd((Date.now()-CST)/1e3|0))},1000)}
async function call(n,v){if(CU)return toast('You are already in a call');
 try{CS=await navigator.mediaDevices.getUserMedia({audio:true,video:!!v})}catch{return toast('Microphone or camera is blocked or unavailable')}
 CU={p:n,v:!!v,out:1,ts:Date.now()};pcn();CS.getTracks().forEach(t=>CP.addTrack(t,CS));await CP.setLocalDescription(await CP.createOffer());await gd(CP);
 cm((v?'🎥 ':'📞 ')+esc(n),'Calling…');$('#lv2').srcObject=CS;bk.postMessage({t:'ring',to:n,from:me.n,v:!!v,s:CP.localDescription.toJSON()});CT=setTimeout(closeMd,30000)}
async function accept(){const o=CU.o;try{CS=await navigator.mediaDevices.getUserMedia({audio:true,video:CU.v})}catch{toast('Microphone or camera is blocked');return closeMd()}
 pcn();CS.getTracks().forEach(t=>CP.addTrack(t,CS));await CP.setRemoteDescription(o);await CP.setLocalDescription(await CP.createAnswer());await gd(CP);
 cm((CU.v?'🎥 ':'📞 ')+esc(CU.p),'Connecting…');$('#lv2').srcObject=CS;connected();bk.postMessage({t:'ans',to:CU.p,from:me.n,s:CP.localDescription.toJSON()})}
function endCall(n){if(!CU)return;const u=CU;CU=null;clearTimeout(CT);clearInterval(CTM);CS&&CS.getTracks().forEach(t=>t.stop());CS=null;CP&&CP.close();CP=null;
 if(n)bk.postMessage({t:'end',to:u.p,from:me.n});
 if(u.out){const ok=!!CST;logc({a:me.n,b:u.p,v:u.v,ts:u.ts,d:ok?((Date.now()-CST)/1e3|0):0,ok:ok?1:0})}CST=0}
bk.onmessage=async e=>{const d=e.data;if(d.to!=me.n)return;
 if(d.t=='ring'){if(CU)return bk.postMessage({t:'end',to:d.from,from:me.n});CU={p:d.from,v:d.v,out:0,ts:Date.now(),o:d.s};cm('📞 '+esc(d.from),'Incoming '+(d.v?'video':'voice')+' call',1)}
 else if(d.t=='ans'&&CU&&CU.p==d.from){await CP.setRemoteDescription(d.s);connected()}
 else if(d.t=='end'&&CU&&CU.p==d.from)closeMd()};
/* ---- Settings ---- */
function rg(){const u=U()[me.email]||{},row=(a,i,t,sm,x)=>`<div class="ri" data-s="${a}" ${x||''}><span style="font-size:20px;width:30px;text-align:center">${i}</span><div class="g"><b>${t}</b>${sm?`<small>${sm}</small>`:''}</div></div>`;
 $('#sg').innerHTML=`<div class="ri" data-s="pic">${AV(me.n,me.c,64)}<div class="g"><b style="font-size:18px">${esc(me.n)}</b><small>${esc(u.email||'')}</small><small>${esc(u.phone||'')}</small></div></div><p class="sh">Account</p>${row('pic','🖼️','Change profile picture')}<p class="sh">Appearance</p>${row('th','🌓','Dark mode',document.documentElement.dataset.t=='dark'?'On':'Off')}<div class="ri" style="gap:8px;flex-wrap:wrap"><small>Chat wallpaper</small>${['#efeae2','#dfe9f5','#e6f2e4','#f6e7ee','#1f2c34'].map(c=>`<span data-w="${c}" style="width:34px;height:34px;border-radius:50%;background:${c};border:2px solid var(--bd);cursor:pointer"></span>`).join('')}</div><p class="sh">Data</p>${row('clr','🧹','Clear all chats','Removes messages on this browser')}<p class="sh">Session</p>${row('out','🚪','Sign out')}${row('del','⚠️','Delete account','','style="color:#e5484d"')}`}
$('#sg').onclick=e=>{const w=e.target.dataset.w;if(w){localStorage.nxw=w;document.documentElement.style.setProperty('--wp',w);return}const t=e.target.closest('[data-s]');if(!t)return;const a=t.dataset.s;
 if(a=='pic')$('#me').click();
 if(a=='th'){$('#th').click();rg()}
 if(a=='out')$('#so').click();
 if(a=='clr'&&confirm('Delete all chat messages on this browser?')){mut(()=>{D.msgs={}});toast('Chats cleared')}
 if(a=='del'&&confirm('Delete your account permanently?')){const u=U();delete u[me.email];localStorage.nxu=JSON.stringify(u);$('#so').click()}};
if(localStorage.nxw)document.documentElement.style.setProperty('--wp',localStorage.nxw);
addEventListener('storage',e=>{if(e.key=='nxcl')rc()});
</script>
</body>
